# Default dev/local profile: file-based H2, no external DB required.
# See README ("Database: H2 vs Postgres") for how to switch to real Postgres.
spring.datasource.url=jdbc:h2:file:./data/riskregister;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
