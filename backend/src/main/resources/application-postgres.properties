# Activate with: --spring.profiles.active=postgres
# Requires a running Postgres instance, e.g.:
#   docker run --name risk-register-db -e POSTGRES_PASSWORD=postgres \
#     -e POSTGRES_DB=riskregister -p 5432:5432 -d postgres:16
spring.datasource.url=jdbc:postgresql://localhost:5432/riskregister
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
